name: Interval
options:
  bundleIdPrefix: com.superapp
  developmentLanguage: nl

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0

settings:
  base:
    # PRODUCT_NAME omitted — defaults to $(TARGET_NAME) per target so the app
    # and test bundle don't collide on the same swiftmodule output.
    SWIFT_VERSION: 5.0
    MARKETING_VERSION: 1.0
    CURRENT_PROJECT_VERSION: 6
    SUPPORTED_PLATFORMS: iphoneos iphonesimulator
    TARGETED_DEVICE_FAMILY: '1,2'
    SUPPORTS_MACCATALYST: NO
    ALWAYS_SEARCH_USER_PATHS: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    DEVELOPMENT_TEAM: VB6FS3N78T

targets:
  Interval:
    type: application
    platform: iOS
    deploymentTarget: '18.0'
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.superapp.interval
        CODE_SIGN_ENTITLEMENTS: Interval/Interval.entitlements
    entitlements:
      path: Interval/Interval.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    dependencies:
      - package: Supabase
        product: Supabase
    sources:
      - path: Interval
    info:
      path: Interval/Info.plist
      properties:
        CFBundleDevelopmentRegion: $(DEVELOPMENT_LANGUAGE)
        # Home-screen name — NOT the target name ("Interval").
        CFBundleDisplayName: Interval
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        # Quoted: unquoted 6.0 parses as a YAML float and XcodeGen emits
        # <real>6</real>, which App Store upload validation rejects — this
        # key must be the string "6.0".
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconName: AppIcon
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UIApplicationSupportsIndirectInputEvents: true
        # No UIBackgroundModes — the timer runs foreground-only in 1.0.
        # If the user backgrounds the app the OS suspends us within a few
        # seconds; recomputeFromWallClock fast-forwards through the missed
        # phases when the user returns. Live Activity / ambient audio /
        # any other reason to keep the app alive in background were all
        # removed for the 1.0 ship.
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [ arm64 ]
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  Interval Tests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: '18.0'
    sources:
      - path: Interval Tests
    dependencies:
      - target: Interval
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.superapp.interval.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Interval:
    build:
      targets:
        Interval: all
        Interval Tests: [test]
    test:
      targets:
        - Interval Tests
    run:
      config: Debug
      # Local StoreKit testing — lets the Pro unlock purchase/restore flow run
      # in the simulator without App Store Connect. Replace/remove once the
      # product is live in App Store Connect for sandbox testing.
      storeKitConfiguration: ProUnlock.storekit
    archive:
      config: Release
