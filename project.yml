name: Interval v1
options:
  bundleIdPrefix: com.superapp
  developmentLanguage: nl

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0

settings:
  base:
    # PRODUCT_NAME omitted — defaults to $(TARGET_NAME) per target so the app
    # and test bundle don't collide on the same swiftmodule output.
    SWIFT_VERSION: 5.0
    MARKETING_VERSION: 1.0
    CURRENT_PROJECT_VERSION: 2
    SUPPORTED_PLATFORMS: iphoneos iphonesimulator
    TARGETED_DEVICE_FAMILY: '2'
    SUPPORTS_MACCATALYST: NO
    ALWAYS_SEARCH_USER_PATHS: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    DEVELOPMENT_TEAM: VB6FS3N78T

targets:
  Interval v1:
    type: application
    platform: iOS
    deploymentTarget: '18.0'
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.superapp.intervalv1
        CODE_SIGN_ENTITLEMENTS: Interval v1/Interval v1.entitlements
    entitlements:
      path: Interval v1/Interval v1.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    dependencies:
      - package: Supabase
        product: Supabase
      - target: Interval Widget
    sources:
      - path: Interval v1
      - path: Shared
    info:
      path: Interval v1/Info.plist
      properties:
        CFBundleDevelopmentRegion: $(DEVELOPMENT_LANGUAGE)
        CFBundleDisplayName: $(PRODUCT_NAME)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: 6.0
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconName: AppIcon
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        NSSupportsLiveActivities: true
        UIApplicationSupportsIndirectInputEvents: true
        UIBackgroundModes:
          - audio
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities: [ arm64 ]
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait

  Interval Widget:
    type: app-extension
    platform: iOS
    deploymentTarget: '18.0'
    sources:
      - path: Interval Widget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.superapp.intervalv1.widget
        INFOPLIST_FILE: Interval Widget/Info.plist
        SKIP_INSTALL: YES

  Interval v1 Tests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: '18.0'
    sources:
      - path: Interval v1 Tests
    dependencies:
      - target: Interval v1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.superapp.intervalv1.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Interval v1:
    build:
      targets:
        Interval v1: all
        Interval v1 Tests: [test]
    test:
      targets:
        - Interval v1 Tests
    run:
      config: Debug
    archive:
      config: Release
