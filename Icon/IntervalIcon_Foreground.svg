<?xml version="1.0" encoding="UTF-8"?>
<!--
  App icon foreground layer — white stopwatch on transparent canvas.

  Bolder than the cream-on-coral revision: strokes thickened ~12-15%
  so the silhouette stays clean at small Home Screen sizes (40-60pt).

  Geometry (viewBox 1024×1024):
  - Face centred at (512, 535), radius 290, stroke 72 → outer Ø = 652.
    Shifted up 37px from a naive "face in middle" so that crown + face
    together are optically balanced — top empty space ≈ bottom empty
    space (163px each).
  - Crown (top button) sits at y=163..211.
  - Stem y=203..243, connects crown to face top.
  - Hand from face centre to roughly the 1:30 position (45° from
    vertical), length ≈ 200, stroke 58, rounded caps.
  - Pivot dot at centre (r=34) prevents the hand looking detached.

  All elements pure white so the silhouette reads cleanly in light mode
  and remains tintable by Icon Composer for Dark/Tinted/Clear variants.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Top crown (the stopwatch's start/stop button) -->
  <rect x="470" y="163" width="84" height="48" rx="16" fill="white"/>
  <!-- Stem connecting crown to face -->
  <rect x="494" y="203" width="36" height="40" fill="white"/>

  <!-- Stopwatch face outline -->
  <circle cx="512" cy="535" r="290"
          stroke="white" stroke-width="72" fill="none"/>

  <!-- Timer hand pointing toward ~1:30 (45° from vertical, length 200) -->
  <line x1="512" y1="535" x2="653.4" y2="393.6"
        stroke="white" stroke-width="58" stroke-linecap="round"/>

  <!-- Center pivot so the hand doesn't look detached -->
  <circle cx="512" cy="535" r="34" fill="white"/>
</svg>
