<?xml version="1.0" encoding="UTF-8"?>
<!--
  App icon background layer — paired with IntervalIcon_Foreground.svg.

  Layered for Apple Icon Composer (iOS 26 Liquid Glass):
  - Bold warm gradient running coral → coral-deep → amber. When Icon
    Composer auto-renders Dark / Tinted / Clear variants this layer is
    what gets recoloured; the foreground stays a clean white silhouette.
  - Matches AppTheme.workGradient so the app icon sits visually in the
    same warm palette as the Home screen's "Start training" button.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="warmGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8826B"/>
      <stop offset="55%" stop-color="#EE946F"/>
      <stop offset="100%" stop-color="#F4B860"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#warmGradient)"/>
</svg>
