<?xml version="1.0" encoding="UTF-8"?>
<!--
  Composited app icon source — merges IntervalIcon_Background.svg and
  IntervalIcon_Foreground.svg into a single 1024×1024 file ready for
  rendering to PNG (qlmanage -t -s 1024 -o out AppIcon.svg).

  Keep the two source files separate too: they map directly to
  "Background" and "Foreground" layers in Apple's Icon Composer when
  you adopt the iOS 26 Liquid Glass workflow — same layout, same
  coordinates, same colours.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="warmGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8826B"/>
      <stop offset="55%" stop-color="#EE946F"/>
      <stop offset="100%" stop-color="#F4B860"/>
    </linearGradient>
  </defs>

  <!-- Background: warm coral → amber gradient -->
  <rect width="1024" height="1024" fill="url(#warmGradient)"/>

  <!-- Foreground: white stopwatch -->
  <rect x="470" y="200" width="84" height="48" rx="16" fill="white"/>
  <rect x="494" y="240" width="36" height="40" fill="white"/>
  <circle cx="512" cy="572" r="290"
          stroke="white" stroke-width="72" fill="none"/>
  <line x1="512" y1="572" x2="653.4" y2="430.6"
        stroke="white" stroke-width="58" stroke-linecap="round"/>
  <circle cx="512" cy="572" r="34" fill="white"/>
</svg>
