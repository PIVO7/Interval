<?xml version="1.0" encoding="UTF-8"?>
<!--
  Composited app icon source - merges IntervalIcon_Background.svg and
  IntervalIcon_Foreground.svg into a single 1024x1024 file ready for
  rendering to PNG (qlmanage -t -s 1024 -o out AppIcon.svg).

  iOS 26 Liquid Glass lives in Interval/AppIcon.icon (Icon Composer).
  That package splits the stopwatch into Ring / Hand / Crown layers
  so the system can apply glass per piece. This SVG remains the flat
  composite for the iOS 18 asset-catalog fallback.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="warmGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8826B"/>
      <stop offset="55%" stop-color="#EE946F"/>
      <stop offset="100%" stop-color="#F4B860"/>
    </linearGradient>
  </defs>

  <!-- Background: warm coral → amber gradient -->
  <rect width="1024" height="1024" fill="url(#warmGradient)"/>

  <!-- Foreground: white stopwatch (shifted up 37px so top + bottom
       empty space match — see IntervalIcon_Foreground.svg for the math) -->
  <rect x="470" y="163" width="84" height="48" rx="16" fill="white"/>
  <rect x="494" y="203" width="36" height="40" fill="white"/>
  <circle cx="512" cy="535" r="290"
          stroke="white" stroke-width="72" fill="none"/>
  <line x1="512" y1="535" x2="653.4" y2="393.6"
        stroke="white" stroke-width="58" stroke-linecap="round"/>
  <circle cx="512" cy="535" r="34" fill="white"/>
</svg>
