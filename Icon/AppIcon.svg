<?xml version="1.0" encoding="UTF-8"?>
<!--
  Composited app icon source — merges IntervalIcon_Background.svg and
  IntervalIcon_Foreground.svg into a single 1024×1024 file ready for
  rendering to PNG (qlmanage -t -s 1024 -o out AppIcon.svg).

  Keep the two source files separate too: they map directly to
  "Background" and "Foreground" layers in Apple's Icon Composer when
  you adopt the iOS 26 Liquid Glass workflow — same layout, same
  coordinates, same colours.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="creamWarmGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBF7F2"/>
      <stop offset="55%" stop-color="#F5EEE1"/>
      <stop offset="100%" stop-color="#EFE5D3"/>
    </linearGradient>
  </defs>

  <!-- Background: warm cream gradient -->
  <rect width="1024" height="1024" fill="url(#creamWarmGradient)"/>

  <!-- Foreground: coral stopwatch -->
  <rect x="476" y="206" width="72" height="42" rx="14" fill="#E8826B"/>
  <rect x="497" y="240" width="30" height="36" fill="#E8826B"/>
  <circle cx="512" cy="568" r="290"
          stroke="#E8826B" stroke-width="64" fill="none"/>
  <line x1="512" y1="568" x2="653.4" y2="426.6"
        stroke="#E8826B" stroke-width="52" stroke-linecap="round"/>
  <circle cx="512" cy="568" r="30" fill="#E8826B"/>
</svg>
