<?xml version="1.0" encoding="UTF-8"?>
<!--
  Composited app icon source — combines IntervalIcon_Background.svg and
  IntervalIcon_Foreground.svg into a single 1024x1024 file ready for
  rendering to PNG (qlmanage -t -s 1024 -o out AppIcon.svg).

  The two source files (Background, Foreground) are kept separate in case
  Apple's new layered icon workflow is adopted later — they map directly
  to "Background" and "Foreground" layers in Icon Composer.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="warmGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8826B"/>
      <stop offset="55%" stop-color="#EE946F"/>
      <stop offset="100%" stop-color="#F4B860"/>
    </linearGradient>
  </defs>
  <!-- Background: coral → amber warm gradient -->
  <rect width="1024" height="1024" fill="url(#warmGradient)"/>
  <!-- 3/4 progress ring: start at 12 o'clock, sweep 270° clockwise, end at 9 o'clock.
       Center (512, 512), radius 320, stroke 80, rounded caps. -->
  <path d="M 512 192 A 320 320 0 1 1 192 512"
        stroke="white"
        stroke-width="80"
        fill="none"
        stroke-linecap="round"/>
  <!-- Progress marker dot at end of ring (9 o'clock position) -->
  <circle cx="192" cy="512" r="52" fill="white"/>
</svg>
