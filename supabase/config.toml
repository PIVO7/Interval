# Supabase project config — checked into git so deploys are reproducible.
# Most settings stay default; the only override we need is the JWT policy
# for the internal dispatcher Edge Function.

project_id = "interval-v1"

# `schedule-live-activity` and `cancel-live-activity` keep the default
# (verify_jwt = true) because they're called by the iOS app with the
# project's anon key. The dispatcher below is called by pg_cron from
# inside Postgres — there's no JWT context, so we open it up. It takes
# no parameters affecting behaviour and only processes already-due
# rows, so being publicly callable doesn't expand the attack surface.

[functions.send-due-live-activity-pushes]
verify_jwt = false
